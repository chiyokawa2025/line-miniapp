<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>チェックイン（スタッフ用）</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Roboto,Arial;margin:0;background:#f6f7f8}
    header{background:#111;color:#fff;padding:14px 18px;font-weight:700}
    main{padding:18px;display:grid;gap:16px}
    button{padding:14px 16px;font-weight:700;border-radius:12px;border:0;background:#111;color:#fff}
    .card{background:#fff;border:1px solid #eee;border-radius:14px;padding:16px}
    .mono{font:14px ui-monospace,monospace;word-break:break-all}
    .ok{color:#0a7}
    .err{color:#c00}
  </style>
</head>
<body>
<header>チェックイン受付（スタッフ用）</header>
<main>
  <div class="card">
    <div id="status" class="mono">初期化中...</div>
  </div>
  <button id="scanBtn">QRコードをスキャン</button>
  <div class="card">
    <div>読み取り結果：</div>
    <div id="result" class="mono">-</div>
  </div>
</main>

<script>
const LIFF_ID = "2008188800-9mKYLPR3"; // スタッフ用

// 画面ログ
function log(msg, cls=""){ const el=document.getElementById("status"); el.textContent=msg; el.className="mono "+cls; }
window.addEventListener("error", e => log("JSエラー: "+e.message, "err"));

// デバッグ用: 状態を見せる
function dumpState(where){
  const s = `@${where}
  inClient=${liff.isInClient?.()}
  loggedIn=${liff.isLoggedIn?.()}
  ver=${liff.getVersion?.?.() || "?"}`;
  console.log(s); log(s, "ok");
}

async function main(){
  try{
    log("LIFF初期化開始...", "");

    // 7秒でタイムアウトさせて必ず原因表示
    await Promise.race([
      liff.init({ liffId: LIFF_ID }),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("liff.init timeout")), 7000))
    ]);

    dumpState("after init");

    // LINEアプリ外で未ログインならログイン
    if (!liff.isInClient() && !liff.isLoggedIn()){
      log("ログインへ遷移...", "");
      liff.login({ redirectUri: location.href });
      return;
    }

    // スキャン
    document.getElementById("scanBtn").addEventListener("click", async()=>{
      try{
        log("カメラ起動中...", "");
        const r = await liff.scanCodeV2();
        document.getElementById("result").textContent = r?.value || "(空)";
        log("読み取り成功", "ok");
      }catch(e){
        log("スキャンエラー: "+(e?.message||e), "err");
        alert("スキャンに失敗: "+(e?.message||e));
      }
    });

    log("準備OK。スキャンできます。", "ok");
  }catch(e){
    // ここに来たら init で落ちています
    log("初期化エラー: "+(e?.message||e), "err");
  }
}
main();
</script>
</body>
</html>
