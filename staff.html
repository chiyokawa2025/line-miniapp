<script>
const LIFF_ID = "2008188800-9mKYLPR3";  // ← ここにスタッフ用の LIFF ID

function log(msg, cls = "") {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "mono " + cls;
}

async function main(){
  try {
    log("LIFF初期化中...", "");
    await liff.init({ liffId: LIFF_ID });
    log(`初期化OK inClient=${liff.isInClient()} / loggedIn=${liff.isLoggedIn()}`, "ok");

    // LINEアプリ外ならログイン処理
    if (!liff.isInClient() && !liff.isLoggedIn()) {
      log("ログインへ遷移します...", "");
      liff.login({ redirectUri: location.href });
      return;
    }

    // スキャンボタンを押したときの処理
    document.getElementById("scanBtn").addEventListener("click", async () => {
      try {
        const r = await liff.scanCodeV2();   // ← QRスキャン
        const text = r.value || "";
        document.getElementById("result").textContent = text || "(空)";
        log("読み取り成功", "ok");
      } catch(e) {
        log("スキャンエラー: " + e, "err");
        alert("スキャンに失敗しました: " + e);
      }
    });

  } catch(e) {
    log("初期化エラー: " + e, "err");
  }
}

main();
</script>
